# Cloudflare Worker "www" (javna stranica). Cloudflare Workers Builds pri svakom pushu na GitHub pokreće `npx wrangler deploy`.
# Tajne RPC_URL i BLOCKSCOUT_KEY ostaju spremljene u Cloudflareu i ne idu u repozitorij.
name = "www"
main = "dist/stablecoini-web.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Vlastite adrese stranice (domena mojaradnadomena.com je na istom Cloudflare računu).
# Glavna je s www, a adresa bez www preusmjerava na nju (src/server.js).
routes = [
  { pattern = "www.stable-l1-chains.mojaradnadomena.com", custom_domain = true },
  { pattern = "stable-l1-chains.mojaradnadomena.com", custom_domain = true }
]
